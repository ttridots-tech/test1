<!DOCTYPE html>

<head>
  <title>Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-5 d-flex justify-content-center">
    <!-- Calculator card -->
    <div class="card shadow-sm" style="width: 320px;">
      <div class="card-body"> Calculator
        <!-- Display (readonly input) -->
        <input id="display" type="text" class="form-control form-control-lg mb-3 mt-3 text-end shadow-sm rounded" value="0">

        <!-- Buttons will go here -->
        <div id="buttons" class="d-grid gap-2" style="grid-template-columns: repeat(4, 1fr); gap: 10px;"></div>

      </div>
    </div>
  </div>

  <script src="calculator.js"></script>
</body>

</html>
