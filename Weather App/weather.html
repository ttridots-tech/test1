<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weather App</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="mb-4 text-center">🌤️ Weather App — Search & Save Favorites</h2>

    <!-- Search row -->
    <div class="row mb-3">
      <div class="col-md-8">
        <input id="cityInput" type="text" class="form-control" placeholder="Enter city name (e.g., London)">
      </div>
      <div class="col-md-4 d-flex gap-2">
        <button id="searchBtn" class="btn btn-primary">Search</button>
        <button id="saveBtn" class="btn btn-outline-success" disabled>Save to Favorites</button>
      </div>
    </div>

    <!-- Result card -->
    <div id="result" class="card mb-4 d-none">
      <div class="card-body">
        <h4 id="cityName"></h4>
        <p id="temp" class="mb-0"></p>
      </div>
    </div>

    <!-- Favorites (CRUD) -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <strong>Favorites</strong>
      </div>
      <ul id="favoritesList" class="list-group list-group-flush"></ul>
    </div>
  </div>

  <!-- App script -->
  <script src="app.js"></script>
</body>
</html>
